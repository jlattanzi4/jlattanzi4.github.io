name: Refresh the reading shelf

# The book on the desk is whatever Joe is reading on Goodreads. Once a day is plenty:
# progress moves a few pages at a time, and the page only says which book and where.

on:
  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reading
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to a release: setup-uv publishes no moving major tag.
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Test the parser
        run: uv run --no-project --with pytest pytest scripts -q
      # The script exits 1 without writing if the page doesn't parse, so a failed run
      # leaves the last good shelf published and nothing to commit.
      - name: Read the Goodreads profile
        run: python3 scripts/reading.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading/
          if git diff --cached --quiet; then
            echo "No change on the shelf"
          else
            git commit -m "reading: refresh the shelf ($(date -u +'%Y-%m-%d'))"
            git push
          fi
